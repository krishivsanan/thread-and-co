<!DOCTYPE html>
<!--
  ============================================================================
  WISHLIST.HTML  -  Module 4: Cart & Wishlist (wishlist half)
  ----------------------------------------------------------------------------
  Owns: viewing saved products, moving one to the cart, and removing one
  from the wishlist. Every wishlist heart button site-wide (home, product
  grid, product details, related products) writes to the same
  localStorage-backed store - see js/store/cart-store.js - so whatever
  got hearted anywhere on the site shows up here.
  ============================================================================
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Wishlist | Thread & Co.</title>
    <meta name="description" content="Products you've saved at Thread & Co." />

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/wishlist.css" />
  </head>

  <body>
    <!-- ======================================================================
         NAVBAR (copied from other pages - keep identical)
         ====================================================================== -->
    <header class="navbar">
      <p class="navbar__announcement">Free shipping on orders over $50 &nbsp;•&nbsp; New drops every Friday</p>

      <div class="container navbar__row">
        <a href="index.html" class="navbar__logo">Thread<span>&</span>Co.</a>

        <nav aria-label="Main">
          <ul class="navbar__links">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html?category=men">Men</a></li>
            <li><a href="products.html?category=women">Women</a></li>
            <li><a href="products.html?category=shoes">Shoes</a></li>
            <li><a href="products.html?category=accessories">Accessories</a></li>
          </ul>
        </nav>

        <form class="navbar__search" role="search" action="products.html" method="get">
          <label for="site-search" class="visually-hidden">Search products</label>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input type="search" id="site-search" name="q" placeholder="Search products..." />
        </form>

        <div class="navbar__actions">
          <a href="wishlist.html" class="navbar__icon-btn" aria-label="Wishlist">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 21s-6.7-4.35-9.3-8.1C1 10.1 1.6 6.6 4.6 5.1c2.4-1.2 5 0 7.4 3 2.4-3 5-4.2 7.4-3 3 1.5 3.6 5 1.9 7.8C18.7 16.65 12 21 12 21z" />
            </svg>
          </a>
          <a href="login.html" class="navbar__icon-btn" aria-label="Account">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6" />
            </svg>
          </a>
          <a href="cart.html" class="navbar__icon-btn" aria-label="Cart">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="9" cy="21" r="1" />
              <circle cx="19" cy="21" r="1" />
              <path d="M2 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L22 7H6" />
            </svg>
            <span class="navbar__icon-badge" hidden>0</span>
          </a>
        </div>

        <button class="navbar__toggle" aria-label="Open menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <!-- id="wishlist-main" so renderEmptyState() in js/wishlist.js can
         replace the whole page body when there's nothing saved -->
    <main id="wishlist-main">
      <div class="container page-header">
        <p class="breadcrumb"><a href="index.html">Home</a> / <span>Wishlist</span></p>
        <h1>Your Wishlist</h1>
      </div>

      <div class="container">
        <!-- Filled in by render() in js/wishlist.js -->
        <div class="product-grid" id="wishlist-grid"></div>
      </div>
    </main>

    <!-- ======================================================================
         FOOTER (copied from other pages)
         ====================================================================== -->
    
         <div id="site-footer"></div>

    <!-- ---------- SCRIPTS ----------
         main.js               = shared behavior (mobile menu, newsletter)
         store/cart-store.js    = cart + wishlist state (localStorage-backed)
         shared/navbar-badges.js = keeps the navbar cart count in sync
         data/products.js        = the product "database" array
         wishlist.js               = this page's own render/move/remove logic -->
    <script src="js/main.js"></script>
    <script src="js/store/cart-store.js"></script>
    <script src="js/shared/navbar-badges.js"></script>
    <script src="js/data/products.js"></script>
    <script src="js/wishlist.js"></script>
    <script src="js/shared/footer.js"></script>
  </body>
</html>
