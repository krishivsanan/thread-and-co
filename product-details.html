<!DOCTYPE html>
<!--
  ============================================================================
  PRODUCT-DETAILS.HTML  -  Module 3: Product Details
  ----------------------------------------------------------------------------
  Owns: image gallery, product name/brand/rating, price + discount, color
  and size selection, quantity, stock status, add to cart / wishlist,
  description, specifications, and reviews.

  This page has almost NO product content hard-coded into it - it's a
  shell of empty containers (id="pd-...") that js/product-details.js
  fills in after reading which product to show from the URL, e.g.:
    product-details.html?id=202
  Every product card site-wide (see js/shared/product-card.js) links
  here with the right ?id=, so this page never needs a separate URL per
  product - one HTML file serves all 20 (and any future) products.
  ============================================================================
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product | Thread & Co.</title>
    <meta name="description" content="Product details at Thread & Co." />

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/products.css" />
    <!-- reuses .filter-option/.size-chip/.color-swatch styling for the selectors -->
    <link rel="stylesheet" href="css/product-details.css" />
  </head>

  <body>
    <!-- ======================================================================
         NAVBAR (copied from index.html/products.html - keep identical)
         ====================================================================== -->
    <header class="navbar">
      <p class="navbar__announcement">Free shipping on orders over $50 &nbsp;•&nbsp; New drops every Friday</p>

      <div class="container navbar__row">
        <a href="index.html" class="navbar__logo">Thread<span>&</span>Co.</a>

        <nav aria-label="Main">
          <ul class="navbar__links">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html?category=men">Men</a></li>
            <li><a href="products.html?category=women">Women</a></li>
            <li><a href="products.html?category=shoes">Shoes</a></li>
            <li><a href="products.html?category=accessories">Accessories</a></li>
          </ul>
        </nav>

        <form class="navbar__search" role="search" action="products.html" method="get">
          <label for="site-search" class="visually-hidden">Search products</label>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input type="search" id="site-search" name="q" placeholder="Search products..." />
        </form>

        <div class="navbar__actions">
          <a href="wishlist.html" class="navbar__icon-btn" aria-label="Wishlist">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 21s-6.7-4.35-9.3-8.1C1 10.1 1.6 6.6 4.6 5.1c2.4-1.2 5 0 7.4 3 2.4-3 5-4.2 7.4-3 3 1.5 3.6 5 1.9 7.8C18.7 16.65 12 21 12 21z" />
            </svg>
          </a>
          <a href="login.html" class="navbar__icon-btn" aria-label="Account">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6" />
            </svg>
          </a>
          <a href="cart.html" class="navbar__icon-btn" aria-label="Cart">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="9" cy="21" r="1" />
              <circle cx="19" cy="21" r="1" />
              <path d="M2 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L22 7H6" />
            </svg>
            <span class="navbar__icon-badge" hidden>0</span>
          </a>
        </div>

        <button class="navbar__toggle" aria-label="Open menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <!-- id="pd-main" lets renderNotFound() blow away the whole page body
         and show a "product not found" state if ?id= doesn't match
         anything in PRODUCTS -->
    <main id="pd-main">
      <div class="container">
        <p class="breadcrumb" id="pd-breadcrumb"><a href="index.html">Home</a> / <a href="products.html">Shop All</a></p>
      </div>

      <div class="container pd-layout">
        <!-- ---------------- GALLERY ---------------- -->
        <div>
          <div class="pd-gallery__main" id="pd-gallery-main"></div>
          <div class="pd-gallery__thumbs" id="pd-gallery-thumbs"></div>
        </div>

        <!-- ---------------- INFO PANEL ----------------
             Everything here (name, price, selectors, stock, buttons) is
             filled in by renderInfo() in js/product-details.js. -->
        <div id="pd-info"></div>
      </div>

      <!-- ---------------- TABS: Description / Specifications / Reviews ---------------- -->
      <div class="container pd-tabs" id="pd-tabs">
        <div class="pd-tabs__nav" id="pd-tabs-nav">
          <button type="button" class="pd-tabs__btn is-active" data-tab="description">Description</button>
          <button type="button" class="pd-tabs__btn" data-tab="specifications">Specifications</button>
          <button type="button" class="pd-tabs__btn" data-tab="reviews">Reviews</button>
        </div>

        <div class="pd-tabs__panel is-active" id="pd-tab-description"></div>
        <div class="pd-tabs__panel" id="pd-tab-specifications"></div>
        <div class="pd-tabs__panel" id="pd-tab-reviews"></div>
      </div>

      <!-- ---------------- RELATED PRODUCTS ---------------- -->
      <section class="container pd-related" id="pd-related" aria-labelledby="pd-related-heading">
        <div class="section-heading">
          <h2 id="pd-related-heading">You may also like</h2>
        </div>
        <div class="scroller">
          <div class="scroller__track" id="pd-related-track"></div>
        </div>
      </section>

      <!-- React demo component -->
      <section class="container" style="margin: 40px 0;">
        <div id="react-feature"></div>
      </section>
    </main>

    <!-- ======================================================================
         FOOTER (copied from index.html/products.html)
         ====================================================================== -->
    
         <div id="site-footer"></div>

    <!-- ---------- SCRIPTS ----------
         main.js               = shared behavior (mobile menu, newsletter)
         store/cart-store.js    = cart + wishlist state (localStorage-backed)
         shared/navbar-badges.js = keeps the navbar cart count in sync
         data/products.js        = the product "database" array
         shared/product-card.js  = builds "You may also like" cards
         product-details.js       = this page's own render/selection logic -->

    <script src="js/shared/footer.js"></script>
    <script src="js/main.js"></script>
    <script src="js/store/cart-store.js"></script>
    <script src="js/shared/navbar-badges.js"></script>
    <script src="js/data/products.js"></script>
    <script src="js/shared/product-card.js"></script>
    <script src="js/product-details.js"></script>
    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <script>
      function ReactFeature() {
        const [saved, setSaved] = React.useState(false);
    
        return React.createElement(
          "button",
          {
            onClick: () => setSaved(!saved)
          },
          saved ? "♥ Saved" : "♡ Save for later"
        );
      }
    
      ReactDOM.createRoot(
        document.getElementById("react-feature")
      ).render(React.createElement(ReactFeature));
    </script>
  </body>
</html>
