<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Account | Thread & Co.</title>

  <!-- Shared CSS -->

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/ai-stylist.css" />

  <!-- Account CSS -->

  <link rel="stylesheet" href="css/account.css">

</head>


<body>


  <!-- ================================================================
       NAVBAR
       ================================================================ -->

  <header class="navbar">

    <p class="navbar__announcement">
      Free shipping on orders over $50
      &nbsp;•&nbsp;
      New drops every Friday
    </p>


    <div class="container navbar__row">


      <!-- LOGO -->

      <a
        href="index.html"
        class="navbar__logo"
      >
        Thread<span>&</span>Co.
      </a>


      <!-- NAVIGATION -->

      <nav aria-label="Main navigation">

        <ul class="navbar__links">

          <li>
            <a href="index.html">
              Home
            </a>
          </li>

          <li>
            <a href="products.html?category=men">
              Men
            </a>
          </li>

          <li>
            <a href="products.html?category=women">
              Women
            </a>
          </li>

          <li>
            <a href="products.html?category=shoes">
              Shoes
            </a>
          </li>

          <li>
            <a href="products.html?category=accessories">
              Accessories
            </a>
          </li>

        </ul>

      </nav>

      <!-- SEARCH BAR -->
      <form class="navbar__search" role="search" action="products.html" method="get">
        <label for="site-search" class="visually-hidden">Search products</label>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input type="search" id="site-search" name="q" placeholder="Search products..." />
      </form>

      <!-- ACTIONS -->
      <div class="navbar__actions">
        <a href="wishlist.html" class="navbar__icon-btn" aria-label="Wishlist">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 21s-6.7-4.35-9.3-8.1C1 10.1 1.6 6.6 4.6 5.1c2.4-1.2 5 0 7.4 3 2.4-3 5-4.2 7.4-3 3 1.5 3.6 5 1.9 7.8C18.7 16.65 12 21 12 21z" />
          </svg>
          <span class="navbar__icon-badge navbar__wishlist-badge" hidden>0</span>
        </a>

        <a href="account.html" class="navbar__icon-btn is-active" aria-label="Account">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6" />
          </svg>
        </a>

        <a href="cart.html" class="navbar__icon-btn" aria-label="Cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1" />
            <circle cx="19" cy="21" r="1" />
            <path d="M2 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L22 7H6" />
          </svg>
          <span class="navbar__icon-badge navbar__cart-badge" hidden>0</span>
        </a>
      </div>


      <!-- MOBILE MENU -->

      <button
        class="navbar__toggle"
        aria-label="Open menu"
        aria-expanded="false"
      >

        <span></span>
        <span></span>
        <span></span>

      </button>

    </div>

  </header>


  <!-- ================================================================
       MAIN
       ================================================================ -->

  <main class="account-page">


    <!-- HEADER -->

    <section class="account-hero">

      <div class="container">

        <p class="account-hero__eyebrow">
          MY THREAD & CO.
        </p>

        <h1>
          Welcome back,
          <span id="account-user-name">
            Guest
          </span>
        </h1>

        <p>
          Manage your account and keep track of every order.
        </p>

      </div>

    </section>


    <!-- ACCOUNT CONTENT -->

    <section class="account-content">

      <div class="container account-dashboard">


        <!-- PROFILE -->

        <aside class="account-profile">

          <div class="profile-avatar" id="profile-avatar">
            U
          </div>


          <h2 id="profile-name">
            User
          </h2>


          <p id="profile-email">
            user@example.com
          </p>


          <div class="profile-divider"></div>


          <button
            id="logout-btn"
            class="btn btn--secondary profile-logout"
          >
            Log out
          </button>

        </aside>


        <!-- ORDERS -->

        <section class="account-orders">


          <div class="account-orders__header">

            <div>

              <p class="account-orders__eyebrow">
                ORDER HISTORY
              </p>

              <h2>
                Your orders
              </h2>

            </div>


            <span
              id="orders-count"
              class="orders-count"
            >
              0 orders
            </span>

          </div>


          <!-- ORDER LIST -->

          <div
            id="orders-list"
            class="orders-list"
          >

            <!-- JavaScript will render orders here -->

          </div>


        </section>


      </div>

    </section>


  </main>


  <!-- ================================================================
       FOOTER
       ================================================================ -->

       <div id="site-footer"></div>


  <!-- ================================================================
       JAVASCRIPT
       ================================================================ -->

  <script src="js/shared/footer.js"></script>
  <script src="js/main.js"></script>
  <script src="js/store/cart-store.js"></script>
  <script src="js/shared/navbar-badges.js"></script>
  <script src="js/account.js"></script>
  <script src="js/ai-stylist.js"></script>


</body>

</html>
